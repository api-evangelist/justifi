openapi: 3.2.0
info:
  description: '## Introduction


    The JustiFi API is a REST-based payment processing API.'
  title: JustiFi API Documentation Payments API
  termsOfService: https://justifi.ai/terms-and-conditions
  x-logo:
    url: https://justifi-brand-assets.s3.us-east-2.amazonaws.com/justifi-light-bg.png
  contact:
    email: api-development@justifi.ai
servers:
- url: https://api.justifi.ai/v1
  description: JustiFi API
tags:
- name: Payments
  description: 'To charge a payment method the desired amount, you''ll use a payment.

    You can choose whether to charge a payment method that''s already been

    tokenized or tokenize a new one when you create the payment.

    If a payment fails, the status will reflect it and an error code will be returned.

    You can retrieve information about your payments and refund them if needed.'
paths:
  /payments:
    post:
      summary: Create a Payment
      description: 'Authorize, capture, and charge a payment method. We limit concurrency to 10 concurrent requests per platform.

        This is due to the nature of the payments API, to reduce rejections, and false positive fraud detection during bulk

        payment processing.


        **Payment methods must be tokenized before creating a payment.** Tokenize payment methods use the embedded

        **JustiFi Tokenize Payment Method Web Component**

        to securely collect and tokenize card or bank account details.


        Once you have a payment method token (e.g. `pm_justifi123`), pass it in the `payment_method.token` field to create a payment.


        > **Note:** Passing raw card or bank account details directly to this endpoint requires prior approval. Contact JustiFi Customer Success

        if you have a use case that requires direct PAN submission. At minimum, a completed SAQ (Self-Assessment Questionnaire) is required to allow raw PAN submissions.


        *Note: If the sub account status is not `enabled`, `400` will be returned.*'
      operationId: CreatePayment
      tags:
      - Payments
      parameters:
      - $ref: '#/components/parameters/idempotency-key-header'
      - $ref: '#/components/parameters/authorization-header'
      - $ref: '#/components/parameters/sub-account-required'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                amount:
                  type: number
                  example: 10000
                  description: amount to charge in cents
                currency:
                  type: string
                  enum:
                  - usd
                  - cad
                  example: usd
                capture_strategy:
                  type: string
                  example: automatic
                  enum:
                  - automatic
                  - manual
                  description: automatic will authorize and capture the payment in the same request; manual will only authorize the payment. An authorized payment will need to be captured in a subsequent capture payment request. If not captured within 7 days the payment will be canceled.  Not supported by bank account (ACH) payment methods.
                email:
                  description: email address to associate with payment method
                  type: string
                  format: email
                payment_method:
                  type: object
                  properties:
                    token:
                      type: string
                      description: A payment method token obtained from the JustiFi Tokenize Payment Method Web Component.
                      example: pm_xyz
                  required:
                  - token
                application_fee_amount:
                  type: integer
                  description: 'Sets a custom application fee amount that applies to this payment, instead of relying on application fee rates configured at the platform account level (*only Platforms may set application_fee_amount*). Must be greater than zero.


                    **New integrations** should use the `fees` array instead for granular control over fee types and selective refunds. See [Enhanced Fee Management](#section/Enhanced-Fee-Management).


                    Cannot be used together with `fees`.


                    > **CAD Payments:** This parameter is not available for CAD payments. Fees for Canadian dollar payments are determined during merchant onboarding and are not configurable via the API. See [Canadian Payments](https://docs.justifi.tech/payments/canadianPayments) for details.

                    '
                  example: 400
                fees:
                  type: array
                  description: 'Array of fee objects to charge on this payment. See [Enhanced Fee Management](https://docs.justifi.tech/api-spec#section/Enhanced-Fee-Management) for full documentation.


                    Each fee object specifies:

                    - `type`: `processing_fee` or `platform_fee` (required)

                    - `amount`: Fee amount in cents (required)


                    **Benefits over `application_fee_amount`:**

                    - Separate fee types for clear reporting

                    - Selective refunds: Choose which fees to return

                    - Each fee type appears as a separate balance transaction


                    Cannot be used together with `application_fee_amount`.


                    > **Note:** The `fees` array will be empty in the create response. Fees are processed asynchronously — subscribe to payment webhook events (recommended) to receive the full fee details, or poll with a subsequent [Get Payment](#tag/Payments/operation/GetPayment) request.


                    > **CAD Payments:** This parameter is not available for CAD payments. Fees for Canadian dollar payments are determined during merchant onboarding and are not configurable via the API. See [Canadian Payments](https://docs.justifi.tech/payments/canadianPayments) for details.

                    '
                  items:
                    $ref: '#/components/schemas/Fee'
                  example:
                  - type: processing_fee
                    amount: 350
                  - type: platform_fee
                    amount: 500
                description:
                  type: string
                  description: your meaningful description of the payment (e.g. an order number or other value from your system)
                  example: order_xyz
                statement_descriptor:
                  type: string
                  description: description of the payment that will be available on the account's bank statement, must have between 5-22 alphanumeric characters and can include dash or underscore
                metadata:
                  type: object
                  format: json
                  description: 'Any useful information you''d like to store alongside this payment.


                    **Testing Disputes**: Include `dispute_test_spec` to create test disputes:

                    - `expected_result`: `"won"` or `"lost"` - Final dispute outcome

                    - `reason`: Dispute reason (`"fraudulent"`, `"unrecognized"`, `"duplicate"`, `"subscription_canceled"`, `"product_unacceptable"`, `"product_not_received"`, `"processing_error"`, `"credit_not_processed"`, `"general"`)

                    - `due_date`: Response deadline in YYYY-MM-DD format

                    - `event_publish_delay_in_seconds`: Delay before dispute creation (default: 0)

                    '
                  example: {}
                expedited:
                  type:
                  - boolean
                  - 'null'
                  description: settlement priority of the payment, only applies to ACH payments
                  example: null
              required:
              - amount
              - currency
              - capture_strategy
              - payment_method
            examples:
              Charge_10_USD_to_a_Tokenized_Payment_Method:
                value:
                  amount: 1000
                  currency: usd
                  capture_strategy: automatic
                  email: example@test.com
                  description: Charging $10 to a tokenized payment method
                  payment_method:
                    token: pm_justifi123
              Charge_10_USD_with_Custom_Application_Fee:
                value:
                  amount: 1000
                  application_fee_amount: 150
                  currency: usd
                  capture_strategy: automatic
                  email: example@test.com
                  description: Charging $10 with a $1.50 application fee
                  payment_method:
                    token: pm_justifi123
              Charge_100_USD_with_Enhanced_Fees:
                value:
                  amount: 10000
                  currency: usd
                  capture_strategy: automatic
                  email: example@test.com
                  description: Payment with enhanced fee management
                  fees:
                  - type: processing_fee
                    amount: 350
                  - type: platform_fee
                    amount: 500
                  payment_method:
                    token: pm_justifi123
              Create_Test_Dispute_Won:
                value:
                  amount: 5000
                  currency: usd
                  capture_strategy: automatic
                  email: example@test.com
                  description: Test payment that will generate a won dispute
                  metadata:
                    dispute_test_spec:
                      expected_result: won
                      reason: fraudulent
                      due_date: '2024-02-15'
                      event_publish_delay_in_seconds: 60
                  payment_method:
                    token: pm_justifi123
              Create_Test_Dispute_Lost:
                value:
                  amount: 10000
                  currency: usd
                  capture_strategy: automatic
                  email: example@test.com
                  description: Test payment that will generate a lost dispute
                  metadata:
                    dispute_test_spec:
                      expected_result: lost
                      reason: product_not_received
                      due_date: '2024-02-20'
                  payment_method:
                    token: pm_justifi123
