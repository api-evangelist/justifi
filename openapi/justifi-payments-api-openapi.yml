  /payments/{id}/refunds:
    post:
      tags:
      - Payments
      summary: Refund a Payment
      description: 'Issue a refund for a payment. You may refund the full payment amount or just a portion. When refunding a portion, multiple refunds are supported up until the full payment amount has been refunded.


        *Note: If the sub account status is not `enabled`, `400` will be returned.*'
      operationId: CreateRefund
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - $ref: '#/components/parameters/idempotency-key-header'
      - $ref: '#/components/parameters/authorization-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                amount:
                  type: number
                  example: 10000
                  description: amount to refund; must be less than or equal to the `amount_refundable` on the payment
                description:
                  description: an optional note about this refund
                  type: string
                reason:
                  description: the reason this refund is being issued
                  type: string
                  example: duplicate
                  enum:
                  - duplicate
                  - fraudulent
                  - customer_request
                fees:
                  type: array
                  description: 'Array of fee objects to return to the merchant as part of this refund. If omitted, no fees are returned (current behavior preserved).


                    Each fee object specifies:

                    - `type`: The fee type to refund (`processing_fee` or `platform_fee`)

                    - `amount`: Amount to return in cents


                    **Validation:**

                    - The requested amount cannot exceed the `remaining_amount` for that fee type on the original payment

                    - The fee type must exist on the original payment


                    > **CAD Payments:** This parameter is not available for CAD payments. See [Canadian Payments](https://docs.justifi.tech/payments/canadianPayments) for details.


                    See [Enhanced Fee Management](#section/Enhanced-Fee-Management) for full documentation.

                    '
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - processing_fee
                        - platform_fee
                        description: The type of fee to refund
                        example: processing_fee
                      amount:
                        type: integer
                        description: Amount to refund in cents
                        example: 175
                    required:
                    - type
                    - amount
                  example:
                  - type: processing_fee
                    amount: 175
                metadata:
                  type: object
                  format: json
                  description: any useful information you'd like to store alongside this refund
                  example: {}
            examples:
              Full_refund:
                value:
                  amount: 10000
                  reason: customer_request
                  description: Customer requested full refund
              Partial_refund_with_processing_fee_return:
                value:
                  amount: 5000
                  reason: customer_request
                  description: Partial refund with processing fee returned
                  fees:
                  - type: processing_fee
                    amount: 175
              Partial_refund_with_all_fees_returned:
                value:
                  amount: 5000
                  reason: customer_request
                  description: Partial refund with both fees returned
                  fees:
                  - type: processing_fee
                    amount: 175
                  - type: platform_fee
                    amount: 250
      responses:
        '201':
          description: Refund was created successfully
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - properties:
                    type:
                      example: refund
                    data:
                      $ref: '#/components/schemas/Refund'
  /payments/{id}/void:
    post:
      tags:
      - Payments
      summary: Void a Payment
      description: 'Void a payment transaction to cancel a payment before it reaches settlement.

        Payment transactions are voidable within 25 minutes of the original transaction.

        This includes `authorized` payments (that were created with `capture_strategy` manual and have not been captured yet).'
