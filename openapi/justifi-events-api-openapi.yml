                  data:
                    oneOf:
                    - $ref: '#/components/schemas/CardPayment'
                    - $ref: '#/components/schemas/BankAccountPayment'
            example: null
            examples:
              Card_payment_created_event:
                value:
                  id: evt_123xyz
                  account_id: acc_123xyz
                  account_type: test
                  platform_account_id: acc_987zyx
                  idempotency_key: string
                  request_id: req_123
                  version: v1
                  data:
                    id: py_xyz
                    account_id: acc_123xyz
                    amount_disputed: 0
                    amount_refunded: 0
                    amount_returned: 0
                    amount: 10000
                    amount_refundable: 10000
                    application_fee_rate_id: afr_123xyz
                    balance: 99850
                    capture_strategy: automatic
                    captured: true
                    created_at: '2021-01-01T12:00:00Z'
                    currency: usd
                    description: my order xyz
                    disputed: false
                    error_code: null
                    error_description: null
                    fee_amount: 150
                    financial_transaction_id: ft_123xyz
                    is_test: true
                    metadata: {}
                    payment_intent_id: pi_xyz
                    refunded: false
                    returned: false
                    status: succeeded
                    terminal_id: trm_123_xyz
                    updated_at: '2021-01-01T12:00:00Z'
                    payment_method:
                      card:
                        id: pm_123xyz
                        acct_last_four: '4242'
                        brand: visa
                        name: Sylvia Fowles
                        token: pm_123xyz
                        metadata: {}
                        bin_details:
                          type: Debit
                          card_brand: Visa
                          card_class: Consumer
                          country: United States of America
                          issuer: WELLS FARGO BANK
                          funding_source: Debit
                        created_at: '2021-01-01T12:00:00Z'
                        updated_at: '2021-01-01T12:00:00Z'
                      customer_id: null
                      signature: 123abc
                    application_fee:
                      id: fee_123xyz
                      amount: 150
                      currency: usd
                      created_at: '2021-01-01T12:00:00Z'
                      updated_at: '2021-01-01T12:00:00Z'
                    transaction_hold:
                      id: th_123xyz
                      financial_transaction_id: ft_123xyz
                    refunds: []
                    disputes: []
                  event_name: payment.created
              Bank_account_payment_created_event:
                value:
                  id: evt_123xyz
                  account_id: acc_123xyz
                  account_type: test
                  platform_account_id: acc_987zyx
                  idempotency_key: string
                  request_id: req_123
                  version: v1
                  data:
                    id: py_xyz
                    account_id: acc_123xyz
                    amount_disputed: 0
                    amount_refunded: 0
                    amount_returned: 0
                    amount: 10000
                    amount_refundable: 10000
                    application_fee_rate_id: afr_123xyz
                    balance: 99850
                    capture_strategy: automatic
                    captured: true
                    created_at: '2021-01-01T12:00:00Z'
                    currency: usd
                    description: my order xyz
                    disputed: false
                    error_code: null
                    error_description: null
                    fee_amount: 150
                    financial_transaction_id: ft_123xyz
                    is_test: true
                    metadata: {}
                    payment_intent_id: pi_xyz
                    refunded: false
                    returned: false
                    status: succeeded
                    updated_at: '2021-01-01T12:00:00Z'
                    payment_method:
                      bank_account:
                        id: pm_123xyz
                        acct_last_four: '4242'
                        name: Sylvia Fowles
                        brand: Wells Fargo
                        token: pm_123xyz
                        created_at: '2021-01-01T12:00:00Z'
                        updated_at: '2021-01-01T12:00:00Z'
