openapi: 3.2.0
info:
  description: '## Introduction


    The JustiFi API is a REST-based payment processing API.'
  title: JustiFi API Documentation Payment Methods API
  termsOfService: https://justifi.ai/terms-and-conditions
  x-logo:
    url: https://justifi-brand-assets.s3.us-east-2.amazonaws.com/justifi-light-bg.png
  contact:
    email: api-development@justifi.ai
servers:
- url: https://api.justifi.ai/v1
  description: JustiFi API
tags:
- name: Payment Methods
  description: 'Payment methods refer to the specific form of payment each customer uses

    (e.g. their credit card). Payment methods are tokenized, then charged at time of payment.'
paths:
  /payment_methods:
    post:
      summary: Create a Payment Method
      description: '**This endpoint requires prior approval.** New integrations should use the

        **JustiFi Tokenize Payment Method Web Component**

        to securely collect and tokenize payment method details.


        The web component handles PCI-scoped data collection and returns a payment method token that you can pass to the

        Create Payment endpoint.


        If you have a use case that requires creating payment methods directly via the API, contact JustiFi Customer Success for approval.

        At minimum, a completed SAQ (Self-Assessment Questionnaire) is required to allow raw PAN submissions.


        *Note: If the sub account status is not `enabled`, `400` will be returned.*'
      operationId: CreatePaymentMethod
      tags:
      - Payment Methods
      parameters:
      - $ref: '#/components/parameters/idempotency-key-header'
      - $ref: '#/components/parameters/authorization-header'
      - $ref: '#/components/parameters/sub-account-required'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                payment_method:
                  anyOf:
                  - type: object
                    properties:
                      payment_method_group_id:
                        description: When present this payment method will be associated with the given payment method group
                        type: string
                      card:
                        $ref: '#/components/schemas/CreateCard'
                      bank_account:
                        $ref: '#/components/schemas/CreateBankAccount'
                email:
                  description: email address to associate with the payment method
                  type: string
                  format: email
                force_tokenize:
                  description: Optional. If set to true in the request payload, allows for tokenization even if validations and authorization fail during the creation of the payment method
                  type: boolean
              required:
              - payment_method
            example: null
            examples:
              Create_a_payment_method_for_card_payments:
                summary: Card payment method (requires SAQ approval)
                description: Requires prior approval and a completed SAQ (Self-Assessment Questionnaire). If possible use the Tokenize Payment Method Web Component instead.
                value:
                  payment_method:
                    payment_method_group_id: pmg_123xyz
                    card:
                      name: Lindsay Whalen
                      number: 4242424242421111
                      verification: 123
                      month: 5
                      year: 2042
                      address_postal_code: 55555
                      metadata:
                        new: info
              Create_a_payment_method_for_ACH_payments:
                summary: ACH payment method (requires SAQ approval)
                description: Requires prior approval and a completed SAQ (Self-Assessment Questionnaire). If possible use the Tokenize Payment Method Web Component instead.
                value:
                  payment_method:
                    payment_method_group_id: pmg_123xyz
                    bank_account:
                      account_owner_name: Lindsay Whalen
                      routing_number: '110000000'
                      account_number: 000123456789
                      account_type: checking
                      account_owner_type: individual
                      country: US
                      currency: usd
                      metadata:
                        new: info
              Create_a_reusable_payment_method_for_card_payments:
                summary: Reusable card payment method (requires SAQ approval)
                description: Requires prior approval and a completed SAQ (Self-Assessment Questionnaire). If possible use the Payment Method Web Component instead.
                value:
                  email: example@test.com
                  payment_method:
                    card:
                      name: Lindsay Whalen
                      number: 4242424242421111
                      verification: '123'
                      month: 5
                      year: 2042
                      address_postal_code: '55555'
                      metadata:
                        new: info
              Create_an_expired_payment_method_for_card_payments:
                summary: Force tokenize expired card (requires SAQ approval)
                description: Requires prior approval and a completed SAQ (Self-Assessment Questionnaire). If possible use the Payment Method Web Component instead.
                value:
                  force_tokenize: true
                  payment_method:
                    card:
                      name: Lindsay Whalen
                      number: 4242424242421111
                      verification: 123
                      month: 5
                      year: 2020
                      address_postal_code: 55555
                      metadata:
                        new: info
              Create_payment_method_associated_with_a_payment_method_group:
                summary: Payment method group association (requires SAQ approval)
                description: Requires prior approval and a completed SAQ (Self-Assessment Questionnaire). If possible use the Payment Method Web Component instead.
                value:
                  force_tokenize: true
                  payment_method:
                    payment_method_group: pmg_123xyz
                    card:
                      name: Lindsay Whalen
                      number: 4242424242421111
                      verification: 123
                      month: 5
                      year: 2020
                      address_postal_code: 55555
                      metadata:
                        new: info
      responses:
        '201':
          description: Payment method was created successfully
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CardResponse'
                - $ref: '#/components/schemas/BankAccountResponse'
                - $ref: '#/components/schemas/CardPresentResponse'
        '400':
          description: Full card number submitted without PCI approval
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaymentError'
              examples:
                Full_PAN_not_allowed:
                  value:
                    error:
                      code: full_pan_not_allowed
                      message: Full card numbers are not accepted on this endpoint. Please use the tokenization iframe to create a payment method token first.
    get:
      summary: List Payment Methods
      description: List the payment methods for your account. This endpoint supports pagination.
      operationId: ListPaymentMethods
      tags:
      - Payment Methods
      parameters:
      - $ref: '#/components/parameters/authorization-header'
      - $ref: '#/components/parameters/sub-account'
      - $ref: '#/components/parameters/customer-id'
      - $ref: '#/components/parameters/payment-method-group-id'
      - $ref: '#/components/parameters/created-before'
      - $ref: '#/components/parameters/created-after'
      responses:
        '200':
          description: Successfully list payment methods
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope-list'
                - properties:
                    type:
                      example: array
                    data:
                      items:
                        anyOf:
                        - $ref: '#/components/schemas/CardPaymentMethodWithBinDetails'
                        - $ref: '#/components/schemas/BankAccountPaymentMethodWithStatus'
                        - $ref: '#/components/schemas/CardPresentPaymentMethod'
  /payment_methods/{token}:
    get:
      summary: Get a Payment Method
      description: 'Get information about a payment method.


        *Note: This is the primary endpoint recommended for retrieving bin_details related to a card payment method.

        bin_details are not guaranteed to be present on every card — availability depends on the card network and issuer.

        When unavailable, the bin_details field will be null.*'
      operationId: GetPaymentMethod
      tags:
      - Payment Methods
      parameters:
      - $ref: '#/components/parameters/authorization-header'
      - $ref: '#/components/parameters/token-path'
      responses:
        '200':
          description: Successfully get a payment method
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CardResponse'
                - $ref: '#/components/schemas/BankAccountResponse'
                - $ref: '#/components/schemas/CardPresentResponse'
    patch:
      summary: Update a Payment Method
      description: Change a payment method's expiration date, address, or metadata.
      operationId: UpdatePaymentMethod
      parameters:
      - $ref: '#/components/parameters/token-path'
      - $ref: '#/components/parameters/idempotency-key-header'
      - $ref: '#/components/parameters/authorization-header'
      tags:
      - Payment Methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                card:
                  $ref: '#/components/schemas/UpdateCard'
      responses:
        '200':
          description: Payment method update was successful
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CardResponse'
                - $ref: '#/components/schemas/BankAccountResponse'
                - $ref: '#/components/schemas/CardPresentResponse'
  /payment_methods/{token}/clone:
    post:
      summary: Clone a Payment Method
      description: 'Copy a payment method from one sub account to another sub account. This allows one

        to share payment methods between accounts without having to collect the card information again.

        The original payment method''s id / token should be provided in the path.'
      operationId: ClonePaymentMethod
      parameters:
      - $ref: '#/components/parameters/token-path'
      - $ref: '#/components/parameters/idempotency-key-header'
      - $ref: '#/components/parameters/authorization-header'
      tags:
      - Payment Methods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                destination_account_id:
                  type: string
                  description: The sub account id to which the payment method should be cloned
                  example: acc_xyz123
      responses:
        '200':
          description: Payment method clone was successful
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/CardResponse'
                - $ref: '#/components/schemas/BankAccountResponse'
                - $ref: '#/components/schemas/CardPresentResponse'
components:
  schemas:
    CardResponse:
      type: object
      properties:
        id:
          description: the object id
          type: number
          example: pm_123xyz
        type:
          description: the object type, or array of objects
          type: string
          example: payment_method
        data:
          description: the attributes for the object
          type: object
          properties:
            signature:
              description: unique signature associated with the payment_method
              type:
              - string
              - 'null'
              example: 3aGWnUznQ
            customer_id:
              description: customer_id is a deprecated field. Please use our payment method groups instead.
              type:
              - string
              - 'null'
              example: cust_123abc
            account_id:
              description: account id associated with payment method
              type:
              - string
              - 'null'
              example: acc_123
            status:
              description: signals whether the payment method is valid or invalid
              type: string
              example: valid
            invalid_reason:
              description: informs reason that the payment method has been marked invalid, if status is invalid
              type:
              - string
              - 'null'
              example: INVALID_ACCOUNT_NUMBER
            created_at:
              type: string
              format: date-time
              example: '2024-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-01T12:00:00Z'
            card:
              description: the card associated with the payment_method
              type: object
              properties:
                id:
                  description: unique card payment method id
                  type: string
                  format: uuid
                  example: pm_123xyz
                name:
                  description: card holder name
                  type:
                  - string
                  - 'null'
                  example: Lindsay Whalen
                acct_last_four:
                  description: last 4 digits of the account number
                  type: string
                  example: 1111
                brand:
                  description: card brand or institution
                  type: string
                  example: visa
                digital_wallet:
                  description: which digital wallet provider the card is tied to
                  type:
                  - string
                  - 'null'
                  enum:
                  - apple_pay
                  - google_pay
                  - null
                  example: apple_pay
                token:
                  description: 'same value as unique bank account id; can be saved and used to process multiple

                    payments with the same bank account

                    '
                  example: pm_123xyz
                month:
                  description: expiration date month
                  example: '5'
                year:
                  description: expiration date year
                  example: '2042'
                metadata:
                  type:
                  - object
                  - 'null'
                  format: json
                  description: any useful information you'd like to store alongside this card
                  example:
                    new: info
                address_line1_check:
                  description: Result of the address line 1 verification check. `pass` — matches the cardholder's address on file; `fail` — does not match; `unavailable` — verification could not be performed; `unchecked` — no address was provided for verification.
                  type: string
                  example: pass
                  enum:
                  - fail
                  - pass
                  - unavailable
                  - unchecked
                address_postal_code_check:
                  description: Result of the postal code verification check. `pass` — matches the cardholder's postal code on file; `fail` — does not match; `unavailable` — verification could not be performed; `unchecked` — no postal code was provided for verification.
                  type: string
                  example: pass
                  enum:
                  - fail
                  - pass
                  - unavailable
                  - unchecked
                bin_details:
                  description: BIN details for this card. Not guaranteed to be present — availability depends on the card network and issuer.
                  allOf:
                  - $ref: '#/components/schemas/BinDetails'
        page_info:
          description: information for cursor style pagination, is null for single records
          type:
          - string
          - 'null'
    CardPresentResponse:
      type: object
      properties:
        id:
          description: the object id
          type: number
          example: pm_123xyz
        type:
          description: the object type, or array of objects
          type: string
          example: payment_method
        data:
          description: the attributes for the object
          type: object
          properties:
            signature:
              description: unique signature associated with the payment_method
              type:
              - string
              - 'null'
              example: 3aGWnUznQ
            customer_id:
              description: customer_id is a deprecated field. Please use our payment method groups instead.
              type:
              - string
              - 'null'
              example: cust_123abc
            account_id:
              description: account id associated with payment method
              type:
              - string
              - 'null'
              example: acc_123
            status:
              description: signals whether the payment method is valid or invalid
              type: string
              example: valid
            invalid_reason:
              description: informs reason that the payment method has been marked invalid, if status is invalid
              type:
              - string
              - 'null'
              example: INVALID_ACCOUNT_NUMBER
            created_at:
              type: string
              format: date-time
              example: '2024-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-01T12:00:00Z'
            card_present:
              description: the card present payment method
              type: object
              properties:
                id:
                  description: unique card present payment method id
                  type: string
                  format: uuid
                  example: cp_7SdSRKRMADOn2Yi5expjej
                brand:
                  description: card brand or institution
                  type: string
                  example: visa
                cardholder_name:
                  description: name of the cardholder
                  type: string
                  example: CARDHOLDER/VISA
                last4:
                  description: last 4 digits of the card number
                  type: string
                  example: '2970'
                expiry:
                  description: card expiration date in MM/YY format
                  type: string
                  example: 11/30
                type:
                  description: the payment method type
                  type: string
                  example: card_present
        page_info:
          description: information for cursor style pagination, is null for single records
          type:
          - string
          - 'null'
    PaymentError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              description: error code if the payment fails
              type: string
              example: card_declined
            decline_code:
              description: decline code if the payment fails
              type: string
              example: do_not_retry
            message:
              description: text description of the error code
              type: string
              example: This card has been rejected. Please try a different card or payment method
            network:
              description: card network used for payment
              type:
              - string
              - 'null'
              example: MASTERCARD
            network_error_category:
              description: network error category code
              type:
              - string
              - 'null'
              example: '03'
            network_error_code:
              description: network error code
              type:
              - string
              - 'null'
              example: '504'
    UpdateCard:
      type: object
      properties:
        month:
          description: new expiration month
          type: string
          example: 5
        year:
          description: new expiration year
          type: string
          example: 2042
        address_line1:
          description: new card address street
          type: string
          example: 123 Fake St
        address_line2:
          description: new card address apartment, suite, etc.
          type: string
          example: Suite 101
        address_city:
          description: new card address city
          type: string
          example: Cityville
        address_state:
          description: new card address state
          type: string
          example: MN
        address_postal_code:
          description: new card address ZIP
          type: string
          example: 55555
        address_country:
          description: new card address 2-character country code
          type: string
          example: US
        metadata:
          type: object
          format: json
          description: any useful information you'd like to store alongside this card; when you update metadata, any previous metadata will be overwritten
          example:
            new: info
    CardPresentPaymentMethod:
      type: object
      properties:
        status:
          description: signals whether the payment method is valid or invalid
          type: string
          example: valid
        invalid_reason:
          description: informs reason that the payment method has been marked invalid, if status is invalid
          type:
          - string
          - 'null'
          example: nil
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00Z'
        card_present:
          type: object
          properties:
            id:
              description: unique card present payment method id
              type: string
              format: uuid
              example: cp_7SdSRKRMADOn2Yi5expjej
            brand:
              description: card brand or institution
              type: string
              example: visa
            cardholder_name:
              description: name of the cardholder
              type: string
              example: CARDHOLDER/VISA
            last4:
              description: last 4 digits of the card number
              type: string
              example: '2970'
            expiry:
              description: card expiration date in MM/YY format
              type: string
              example: 11/30
            type:
              description: the payment method type
              type: string
              example: card_present
        customer_id:
          description: id of the customer associated with the payment method
          type:
          - string
          - 'null'
          example: cust_xyz
        signature:
          description: signature that uniquely identifies a credit card or bank account across payment methods
          type:
          - string
          - 'null'
          example: 4guAJNkVA3lRLVlanNVoBK
        account_id:
          description: account id associated with payment method
          type:
          - string
          - 'null'
          example: acc_123
    BankAccountResponse:
      type: object
      properties:
        id:
          description: the object id
          type: number
          example: pm_123xyz
        type:
          description: the object type, or array of objects
          type: string
          example: payment_method
        data:
          description: the attributes for the object
          type: object
          properties:
            signature:
              description: unique signature associated with the payment_method
              type:
              - string
              - 'null'
              example: 3aGWnUznQ
            customer_id:
              description: customer_id is a deprecated field. Please use our payment method groups instead.
              type:
              - string
              - 'null'
              example: cust_123abc
            account_id:
              description: account id associated with payment method
              type: string
              example: acc_123
            status:
              description: signals whether the payment method is valid or invalid
              type: string
              example: valid
            invalid_reason:
              description: informs reason that the payment method has been marked invalid, if status is invalid
              type:
              - string
              - 'null'
              example: nil
            created_at:
              type: string
              format: date-time
              example: '2024-01-01T12:00:00Z'
            updated_at:
              type: string
              format: date-time
              example: '2024-01-01T12:00:00Z'
            bank_account:
              description: the bank account associated with the payment_method
              type: object
              properties:
                id:
                  description: unique bank account payment method id
                  type: string
                  format: uuid
                  example: pm_123xyz
                account_owner_name:
                  description: account owner name
                  type: string
                  example: Lindsay Whalen
                account_type:
                  description: type of account (checking, savings, etc.)
                  type: string
                  example: checking
                bank_name:
                  description: bank name
                  type:
                  - string
                  - 'null'
                  example: Wells Fargo
                acct_last_four:
                  description: last 4 digits of the account number
                  type: string
                  example: 1111
                token:
                  description: 'same value as unique bank account id; can be saved and used to process multiple

                    payments with the same bank account

                    '
                  example: pm_123xyz
                metadata:
                  type:
                  - object
                  - 'null'
                  format: json
                  description: any useful information you'd like to store alongside this bank account
                  example:
                    new: info
        page_info:
          description: information for cursor style pagination, is null for single records
          type:
          - string
          - 'null'
    CardWithBinDetails:
      type: object
      properties:
        id:
          description: unique card id
          type: string
          format: uuid
          example: pm_123xyz
        acct_last_four:
          description: last 4 digits of the card number
          type: string
          example: 4242
        brand:
          description: card brand or bank name
          example: Visa
        digital_wallet:
          description: which digital wallet provider the card is tied to
          type:
          - string
          - 'null'
          enum:
          - apple_pay
          - google_pay
          - null
          example: apple_pay
        name:
          description: card or account holder name
          type:
          - string
          - 'null'
          example: Amanda Kessel
        token:
          description: 'same value as unique card id; can be saved and used to process multiple

            payments with the same card

            '
          example: pm_123xyz
        month:
          description: expiration date month
          example: '5'
        year:
          description: expiration date year
          example: '2042'
        metadata:
          type:
          - object
          - 'null'
          format: json
          description: any useful information you'd like to store alongside this card
          example: {}
        address_line1_check:
          description: Result of the address line 1 verification check. `pass` — matches the cardholder's address on file; `fail` — does not match; `unavailable` — verification could not be performed; `unchecked` — no address was provided for verification.
          type: string
          example: unchecked
          enum:
          - fail
          - pass
          - unavailable
          - unchecked
        address_postal_code_check:
          description: Result of the postal code verification check. `pass` — matches the cardholder's postal code on file; `fail` — does not match; `unavailable` — verification could not be performed; `unchecked` — no postal code was provided for verification.
          type: string
          example: unchecked
          enum:
          - fail
          - pass
          - unavailable
          - unchecked
        bin_details:
          description: BIN details for this card. Not guaranteed to be present — availability depends on the card network and issuer.
          allOf:
          - $ref: '#/components/schemas/BinDetails'
    BinDetails:
      description: BIN (Bank Identification Number) details for a card. bin_details are not guaranteed to be present on every card payment method — availability depends on the card network and issuer. When unavailable, this field will be null.
      type:
      - object
      - 'null'
      properties:
        type:
          description: Type of card issued, values include Credit, Debit, Prepaid, Unknown
          type: string
          example: Credit
        card_brand:
          description: Brand or network associated with card. Possible values include Visa, Mastercard, American Express, Discover
          type: string
          example: Visa
        card_class:
          type: string
          example: Consumer
        country:
          description: Long form country name which issued the card
          type: string
          example: United States of America
        issuer:
          description: Issuing bank
          type: string
          example: WELLS FARGO BANK, N.A.
        funding_source:
          description: Source of funds defined by BIN for a given card. Values include Charge, Credit, Debit, Deferred Debit (Visa Only), Network Only, Prepaid
          type: string
          example: Credit
    Envelope-list:
      type: object
      properties:
        id:
          description: the object id
          type: number
          example: 1
        type:
          description: the object type, or array of objects
          type: string
          example: account
        data:
          description: the list of objects
          type: array
        page_info:
          description: information for cursor style pagination
          $ref: '#/components/schemas/PageInfo'
    BankAccount:
      type: object
      properties:
        id:
          description: unique bank account payment method id
          type: string
          format: uuid
          example: pm_123xyz
        account_owner_name:
          description: account owner name
          type: string
          example: Lindsay Whalen
        account_type:
          description: type of account (checking, savings, etc.)
          type: string
          example: checking
        bank_name:
          description: bank name
          type:
          - string
          - 'null'
          example: Wells Fargo
        acct_last_four:
          description: last 4 digits of the account number
          type: string
          example: 1111
        token:
          description: 'same value as unique bank account id; can be saved and used to process multiple

            payments with the same bank account

            '
          example: pm_123xyz
        metadata:
          type:
          - object
          - 'null'
          format: json
          description: any useful information you'd like to store alongside this bank account
          example:
            new: info
    CreateBankAccount:
      type: object
      description: Bank Account
      properties:
        account_owner_name:
          description: account owner name
          type: string
          example: Lindsay Whalen
        routing_number:
          description: routing number
          type: string
          example: '110000000'
        account_number:
          description: bank account number
          type: string
          example: 000123456789
        account_type:
          description: type of account
          type: string
          example: checking
          enum:
          - checking
          - savings
