name: JustiFi
description: >-
  JustiFi is an embedded-payments and PayFac-as-a-service platform that lets SaaS
  companies add payment processing to their software. Its REST API (base
  https://api.justifi.ai/v1) plus StencilJS web components handle sub-merchant
  onboarding, card and bank-account tokenization, payments, refunds, disputes,
  payouts, proceeds, checkouts, and card-present terminals, while JustiFi carries
  the PCI-DSS Level 1, SOC 2, and GDPR compliance burden. Authentication is OAuth
  2.0 client-credentials yielding 24-hour Bearer tokens, with idempotent money
  movement, cursor pagination, and webhook events. Backed by Emergence Capital.
